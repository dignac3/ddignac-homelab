services:
  registry:
    image: registry:2
    container_name: registry
    restart: always
    volumes:
      - registry_data:/var/lib/registry 
    
    networks:
      - admin_net

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.registry.rule=Host(`registry.ddignac.fr`)"
      - "traefik.http.routers.registry.entrypoints=websecure"
      - "traefik.http.routers.registry.tls.certresolver=letsencrypt"
      
      - "traefik.http.routers.registry.service=registry-service"
      - "traefik.http.services.registry-service.loadbalancer.server.port=5000"
      - "traefik.http.services.registry-service.loadbalancer.server.scheme=http"
networks:
  admin_net:
    external: true

volumes:
  registry_data:
    external: true