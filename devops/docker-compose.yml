services:
  registry:
    image: registry:3
    container_name: registry
    restart: always
    environment:
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Origin: '[http://registry-ui.ddignac.fr]'
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Methods: '[HEAD,GET,OPTIONS,DELETE]'
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Credentials: '[true]'
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Headers: '[Authorization,Accept,Cache-Control]'
      REGISTRY_HTTP_HEADERS_Access-Control-Expose-Headers: '[Docker-Content-Digest]'
      REGISTRY_STORAGE_DELETE_ENABLED: 'true'
    volumes:
      - registry_data:/var/lib/registry 
    
    networks:
      - admin_net

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.registry.rule=Host(`registry.ddignac.fr`)"
      - "traefik.http.routers.registry.entrypoints=websecure"
      - "traefik.http.routers.registry.tls.certresolver=letsencrypt"
      
      - "traefik.http.routers.registry.service=registry-service"
      - "traefik.http.services.registry-service.loadbalancer.server.port=5000"
      - "traefik.http.services.registry-service.loadbalancer.server.scheme=http"
      - "traefik.http.routers.registry.middlewares=adminWhitelist@file,basicauth@file"

  registry_ui:
    image: joxit/docker-registry-ui:latest
    container_name: registry_ui
    restart: unless-stopped
    environment:
      NGINX_PROXY_PASS_URL: http://registry:5000
      NGINX_PROXY_URL: https://registry-ui.ddignac.fr
      
      
    networks:
      - admin_net # Pour communiquer avec Traefik et Authentik
      
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.registry-ui.rule=Host(`registry-ui.ddignac.fr`)"
      - "traefik.http.routers.registry-ui.entrypoints=websecure"
      - "traefik.http.routers.registry-ui.tls.certresolver=letsencrypt"
      - "traefik.http.routers.registry-ui.middlewares=adminWhitelist@file,authentikAuth@file"

      
networks:
  admin_net:
    external: true



volumes:
  registry_data:
    external: true