services:
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION}
    container_name: prometheus
    restart: always
    networks:
      - admin_net
    ports:
      - "9090:9090"
    volumes:
      - prometheus_config:/etc/prometheus
      - prometheus_data:/prometheus
      - /var/run/docker.sock:/var/run/docker.sock:ro # ACCÈS À LA DÉCOUVERTE DOCKER
    labels:
      - traefik.enable=true
      - traefik.docker.network=admin_net
      - traefik.http.routers.prometheus.rule=Host(`metrics.${DOMAIN_NAME}`)
      - traefik.http.routers.prometheus.entrypoints=websecure
      - traefik.http.routers.prometheus.tls.certresolver=letsencrypt
      - traefik.http.routers.prometheus.middlewaresadminWhitelist@file,authentickAuth@file
      - traefik.http.services.prometheus.loadbalancer.server.port=9090
    extra_hosts: 
      - "host.docker.internal:172.17.0.1"
    

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    container_name: grafana
    restart: always
    ports:  
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - admin_net
    labels:
      - traefik.enable=true
      - traefik.docker.network=admin_net
      - traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN_NAME}`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.tls.certresolver=letsencrypt
      - traefik.http.routers.grafana.middlewaresadminWhitelist@file
      - traefik.http.services.grafana.loadbalancer.server.port=3000


  node-exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: node-exporter
    restart: always
    network_mode: host 
    pid: host 
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/rootfs:ro,rslave
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host)($$|/)'

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: always
    network_mode: host
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro

networks:
  admin_net:
    external: true
  # AJOUTER ICI LES RÉSEAUX DE BDD (db_net_a, etc.)

volumes:
  grafana_data:
  prometheus_data:
  prometheus_config: