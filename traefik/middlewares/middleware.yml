http:
  middlewares:
    adminWhitelist:
      ipWhitelist:
        sourceRange:
          - "10.3.0.0/24"
          - "192.168.1.0/24"
    httpsRedirect:
      redirectScheme:
        scheme: https
        permanent: true
    authentikAuth:
      forwardAuth:
        address: http://authentik-proxy-1:9000/outpost.goauthentik.io/auth/traefik
        trustForwardHeader: true
        authResponseHeaders:
            - X-authentik-username
            - X-authentik-groups
            - X-authentik-entitlements
            - X-authentik-email
            - X-authentik-name
            - X-authentik-uid
            - X-authentik-jwt
            - X-authentik-meta-jwks
            - X-authentik-meta-outpost
            - X-authentik-meta-provider
            - X-authentik-meta-app
            - X-authentik-meta-version
      

    securityHeaders:
      headers:
        sslRedirect: true
        stsSeconds: 31536000
        contentTypeNosniff: true

    compressGzip:
      compress: true

    basicauth:
      basicAuth:
        users:
          - "admin:$2a$05$sTTis5YfkSHqCvA9KtySuuz9y9FDx4S8Xgr9sxoZuOJustupWb0S2"

  routers:
    ha-router:
      entryPoints:
        - websecure
      rule: "Host(`home.ddignac.fr`)"
      service: ha-service
      middlewares:
        - securityHeaders
        - compressGzip
        - httpsRedirect
      tls:
        certResolver: letsencrypt 
    esphome-router:
      entryPoints:
        - websecure
      rule: "Host(`esp.ddignac.fr`)"
      service: esphome-service
      middlewares:
        - securityHeaders
        - compressGzip
        - httpsRedirect
      tls:
        certResolver: letsencrypt
        
  services:
    ha-service:
      loadBalancer:
        servers:
          - url: "http://192.168.1.2:8123"
    esphome-service:
      loadBalancer:
        servers:
          - url: "http://192.168.1.2:6052"