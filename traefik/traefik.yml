log:
  level: DEBUG

metrics:
  prometheus:
    addRoutersLabels: true
    buckets:
      - 0.1
      - 0.3
      - 1.2
      - 5.0

providers:
  docker:
    exposedByDefault: false
  file:
    directory: /etc/traefik/dynamic/
    watch: true

api:
  dashboard: true
  insecure: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
          entryPoint:
              scheme: https
              to: websecure  
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt
        domains:
          - main: "ddignac.fr"
            sans:
              - "*.ddignac.fr"
    

certificatesResolvers:
  letsencrypt:
    acme:
      email: dorian@ddignac.fr
      storage: acme.json
      dnsChallenge:
        provider: cloudflare
        delayBeforeCheck: 10
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"
  letsencryptHTTP:
    acme:
      email: dorian@ddignac.fr
      storage: acme-http.json
      httpChallenge:
        entryPoint: web

tls:
  certificates:
    - domains:
        - main: "ddignac.fr"
          sans:
            - "*.ddignac.fr"