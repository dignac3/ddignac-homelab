services:
  traefik:
    image: traefik
    container_name: traefik
    networks:
      - admin_net
      - dmz_net
    ports:
      - 81:80
      - 444:443
    expose:
      - 8085 # expose the dashboard only in traefik network 
    volumes:
      - /home/dodo/ssl-certs:/ssl-certs
      - /home/dodo/ddignac-homelab/traefik/etc/traefik:/etc/traefik
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    labels:
      - "traefik.enable=true" # <== Enable traefik on itself to view dashboard and assign subdomain to view it
      - "traefik.http.routers.traefik_https.rule=Host(`traefik.ddignac.fr`)" # <== Setting the domain for the dashboard
      - "traefik.http.routers.traefik_https.entrypoints=web,websecure"
      - "traefik.http.routers.traefik_https.service=traefik-service"
      - "traefik.http.services.traefik-service.loadbalancer.server.port=8080"
      - "traefik.http.routers.traefik_https.tls=true"
      - "traefik.http.routers.traefik_https.tls.certresolver=production"
      - "traefik.http.routers.traefik_https.middlewares=basic-auth-global"
      - "traefik.http.middlewares.basic-auth-global.basicauth.usersfile=/etc/traefik/users"

networks:
  admin_net: 
    external: true
  dmz_net:
    external: true