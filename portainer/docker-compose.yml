services:
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:${PORTAINER_VERSION}
    ports:
      - 10443:9443
    volumes:
      - /etc/letsencrypt/live/npm-3/fullchain.pem:/certs/portainer.crt
      - /etc/letsencrypt/live/npm-3/privkey.pem:/certs/portainer.key
      - data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - admin_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`portainer.${DOMAIN_NAME}`)"
      - "traefik.http.routers.portainer.entrypoints=websecure"
      - "traefik.http.routers.portainer.tls.certresolver=letsencrypt"
      - "traefik.http.routers.portainer.middlewares=adminWhitelist@file"
      
      - "traefik.http.services.portainer-service.loadbalancer.server.port=9000"
      - "traefik.http.services.portainer-service.loadbalancer.server.scheme=http"

    extra_hosts:
      - "${DOMAIN_NAME}:192.168.1.2"

volumes:
  data:

networks:
  admin_net: 
    external: true