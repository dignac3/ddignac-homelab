services:
  jellyfin:
    image: jellyfin/jellyfin:${JELLYFIN_VERSION:-latest}
    container_name: jellyfin
    ports:
      - "8096:8096"
    user: "${MEDIA_UID:-1100}:${MEDIA_GID:-1100}"
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - downloads:/media:ro
    restart: 'unless-stopped'
    environment:
      - JELLYFIN_PublishedServerUrl=https://tv.${DOMAIN_NAME}
    networks:
     - dmz_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(`tv.${DOMAIN_NAME}`)"
      - "traefik.http.routers.jellyfin.entrypoints=websecure"
      - "traefik.http.routers.jellyfin.tls.certresolver=letsencrypt"
      - "traefik.http.routers.jellyfin.middlewares=securityHeaders@file"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"

  # --- Requests portal (users ask for movies/shows, pushes to Radarr/Sonarr) ---
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    volumes:
      - jellyseerr-config:/app/config
    restart: unless-stopped
    networks:
      - dmz_net
      - admin_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyseerr.rule=Host(`requests.${DOMAIN_NAME}`)"
      - "traefik.http.routers.jellyseerr.entrypoints=websecure"
      - "traefik.http.routers.jellyseerr.tls.certresolver=letsencrypt"
      - "traefik.http.routers.jellyseerr.middlewares=securityHeaders@file"
      - "traefik.http.services.jellyseerr.loadbalancer.server.port=5055"

  # --- Indexer aggregator, feeds Sonarr/Radarr with search results ---
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${MEDIA_UID:-1100}
      - PGID=${MEDIA_GID:-1100}
      - TZ=Etc/UTC+1
    volumes:
      - prowlarr-config:/config
    restart: unless-stopped
    networks:
      - admin_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.${DOMAIN_NAME}`)"
      - "traefik.http.routers.prowlarr.entrypoints=websecure"
      - "traefik.http.routers.prowlarr.tls.certresolver=letsencrypt"
      - "traefik.http.routers.prowlarr.middlewares=adminWhitelist@file,securityHeaders@file"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"

  # --- Series automation: search, download via transmission, rename into /media/series (or /media/animes) ---
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${MEDIA_UID:-1100}
      - PGID=${MEDIA_GID:-1100}
      - TZ=Etc/UTC+1
    volumes:
      - sonarr-config:/config
      - downloads:/downloads
      - downloads:/media
    restart: unless-stopped
    networks:
      - admin_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.${DOMAIN_NAME}`)"
      - "traefik.http.routers.sonarr.entrypoints=websecure"
      - "traefik.http.routers.sonarr.tls.certresolver=letsencrypt"
      - "traefik.http.routers.sonarr.middlewares=adminWhitelist@file,securityHeaders@file"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"

  # --- Movie automation: search, download via transmission, rename into /media/films ---
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${MEDIA_UID:-1100}
      - PGID=${MEDIA_GID:-1100}
      - TZ=Etc/UTC+1
    volumes:
      - radarr-config:/config
      - downloads:/downloads
      - downloads:/media
    restart: unless-stopped
    networks:
      - admin_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`radarr.${DOMAIN_NAME}`)"
      - "traefik.http.routers.radarr.entrypoints=websecure"
      - "traefik.http.routers.radarr.tls.certresolver=letsencrypt"
      - "traefik.http.routers.radarr.middlewares=adminWhitelist@file,securityHeaders@file"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"

  # --- Subtitles automation for Sonarr/Radarr libraries ---
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${MEDIA_UID:-1100}
      - PGID=${MEDIA_GID:-1100}
      - TZ=Etc/UTC+1
    volumes:
      - bazarr-config:/config
      - downloads:/media
    restart: unless-stopped
    networks:
      - admin_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bazarr.rule=Host(`bazarr.${DOMAIN_NAME}`)"
      - "traefik.http.routers.bazarr.entrypoints=websecure"
      - "traefik.http.routers.bazarr.tls.certresolver=letsencrypt"
      - "traefik.http.routers.bazarr.middlewares=adminWhitelist@file,securityHeaders@file"
      - "traefik.http.services.bazarr.loadbalancer.server.port=6767"

  # --- VPN gateway for transmission (ProtonVPN via WireGuard) ---
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${VPN_WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${VPN_WIREGUARD_ADDRESSES}
      - SERVER_COUNTRIES=${VPN_SERVER_COUNTRIES:-France}
    volumes:
      - gluetun-config:/gluetun
    restart: unless-stopped
    networks:
      - admin_net
    ports:
      - 9091:9091 #TODO DELETE (handled by traefik)
    # Traefik labels live here, not on transmission: once transmission uses
    # network_mode: service:gluetun it has no network attachment of its own.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.transmission.rule=Host(`torrent.${DOMAIN_NAME}`)"
      - "traefik.http.routers.transmission.entrypoints=websecure"
      - "traefik.http.routers.transmission.tls=true"
      - "traefik.http.routers.transmission.tls.certresolver=letsencrypt"
      - "traefik.http.routers.transmission.middlewares=adminWhitelist@file,securityHeaders@file,authentikAuth@file"
      - "traefik.http.services.transmission.loadbalancer.server.port=9091"

  transmission:
    image: lscr.io/linuxserver/transmission:${TRANSMISSION_VERSION:-latest}
    container_name: transmission
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - PUID=${MEDIA_UID:-1100}
      - PGID=${MEDIA_GID:-1100}
      - TZ=Etc/UTC+1
    volumes:
      - transmission-config:/config
      - downloads:/downloads
      - softwares:/downloads/softwares
      - torrent-watch:/watch
    restart: unless-stopped

  samba:
    image: dperson/samba:latest
    container_name: media-smb
    ports:
      - "139:139"
      - "445:445"
    environment:
      TZ: Europe/Paris
      USERID: "${MEDIA_UID:-1100}"
      GROUPID: "${MEDIA_GID:-1100}"
      USER: "${SAMBA_DOWNLOAD_USER};${SAMBA_DOWNLOAD_PASSWORD}"
      USER2: "${SAMBA_MUSIC_USER};${SAMBA_MUSIC_PASSWORD}"
      SHARE: "downloads;/downloads;yes;yes;no;${SAMBA_DOWNLOAD_USER},${SAMBA_MUSIC_USER};none;${SAMBA_DOWNLOAD_USER};Media downloads"
      WORKGROUP: "${SAMBA_WORKGROUP:-WORKGROUP}"
      GLOBAL2: "create mask = 0664"
      GLOBAL3: "directory mask = 2775"
    volumes:
      - downloads:/downloads
    restart: unless-stopped
    networks:
      - admin_net


volumes:
  transmission-config:
  softwares:
  downloads:
  jellyfin-cache:
  jellyfin-config:
  jellyseerr-config:
  prowlarr-config:
  sonarr-config:
  radarr-config:
  bazarr-config:
  torrent-watch:
  gluetun-config:

networks:
  dmz_net:
    external: true
  admin_net:
    external: true