volumes:
  wireguard-configs:
  pihole-etc:
  pihole-dnsmasq:
  unbound-config:

networks:
  vpn:
    external: true

services:
  wg-easy:
    image: weejewel/wg-easy:latest
    container_name: wg-easy
    restart: unless-stopped
    network_mode: host
    environment:
      - WG_HOST=${MASTER_PUBLIC_FQDN}    
      - PASSWORD=${WG_PASSWORD}
      - WG_PORT=51820
      - WG_DEFAULT_ADDRESS=10.3.0.x
      - WG_DEFAULT_DNS=192.168.1.2
      # AllowedIPs = tous les réseaux accessibles via VPN
      # inclut LAN + réseaux Docker internes
      - WG_ALLOWED_IPS=192.168.1.0/24,10.100.0.0/24,10.10.0.0/24,10.30.0.0/24,10.2.0.0/24,10.3.0.0/24
    volumes:
      - wireguard-configs:/etc/wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE

 
  unbound:
    image: mvance/unbound:latest
    container_name: unbound
    restart: unless-stopped
    hostname: unbound
    volumes:
      - unbound-config:/etc/unbound
    environment:
      - TZ=Europe/Paris
    networks:
      vpn:
        ipv4_address: ${UNBOUND_IP}


  pihole:
    depends_on:
      - unbound
    container_name: pihole
    image: pihole/pihole:latest
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "54:80"
    dns:
      - ${UNBOUND_IP}
      - 1.1.1.1
    environment:
      TZ: "Europe/Paris"
      WEBPASSWORD: ${PIHOLE_PASSWORD}
      ServerIP: 192.168.1.2 #${PIHOLE_IP}        # IP du serveur hôte
      DNS1: ${UNBOUND_IP}
      DNS2: 1.1.1.1
      VIRTUAL_HOST: ${PIHOLE_VIRTUAL_HOST}
      FTLCONF_dns_listeningMode: 'ALL' # ajouté car pihole dans un réseau docker & je veux l'accès dans le LAN de la maison 
    hostname: ${PIHOLE_VIRTUAL_HOST}
    volumes:
      - pihole-etc:/etc/pihole
      - pihole-dnsmasq:/etc/dnsmasq.d
    networks:
      vpn:
        ipv4_address: ${PIHOLE_IP}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pihole.rule=Host(`dns.ddignac.fr`)"
      - "traefik.http.routers.pihole.entrypoints=websecure"
      - "traefik.http.routers.pihole.tls.certresolver=letsencrypt"
      - "traefik.http.routers.pihole.middlewares=adminWhitelist@file,pihole-redirect"

      - 'traefik.http.middlewares.pihole-redirect.redirectregex.regex=^https://dns\.ddignac\.fr/$'
      - "traefik.http.middlewares.pihole-redirect.redirectregex.replacement=https://dns.ddignac.fr/admin/login"
      - "traefik.http.middlewares.pihole-redirect.redirectregex.permanent=true"

      - "traefik.http.services.pihole.loadbalancer.server.port=80"
    cap_add:
      - NET_ADMIN
